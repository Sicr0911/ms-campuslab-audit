server:
  port: 8084

spring:
  application:
    name: ms-campuslab-audit

  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
    username: ${DB_USERNAME:campuslab_audit}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo gestiona Flyway, no Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    # Este servicio comparte el mismo usuario/schema Oracle que catalog,
    # bookings y report (una sola BD para todo el caso). Sin una tabla de
    # historial propia, todos comparten flyway_schema_history y Flyway
    # rechaza el V1 de este servicio por checksum distinto al V1 de otro
    # microservicio que ya ocupaba esa version en la tabla compartida.
    table: flyway_schema_history_audit

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:https://login.microsoftonline.com/c75374e8-15d8-446b-8c6c-291120e0c761/v2.0}

  # Broker externo (mismo cluster Kafka de infra/kafka que usa bookings como
  # productor). group-id "audit-svc" coincide con el sufijo de la dead-letter
  # topic propia de este servicio (bookings.events.audit-svc.DLT).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.26.47.196:9092}
    consumer:
      group-id: audit-svc

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # Mismo motivo que en bookings/catalog: el broker externo puede no estar
    # disponible en un momento dado sin que eso signifique que este servicio
    # este realmente caido.
    kafka:
      enabled: false

logging:
  level:
    com.campuslab.audit: INFO
    org.hibernate.SQL: WARN
